name: API Test Suite

# Two triggers:
#
# 1. schedule — automatic, 10:30 AM IST (05:00 UTC) Monday-Friday. A
#    scheduled run can't be prompted for input, so its parameters are
#    hardcoded in the "Resolve run parameters" step below: prod, sanity
#    markers, cleanup on, all three recipients notified.
#
# 2. workflow_dispatch — manual, via the Actions tab "Run workflow" button
#    (or `gh workflow run api-tests.yml`), which lets you pick environment/
#    markers/cleanup/recipients each time.
#
# Either way, every run creates real records (farmer, asset, plan type,
# crop variety, plan, project, ...) in whichever environment is targeted.
on:
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - uat
          - prod
      markers:
        description: "Which tests to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - sanity
          - smoke
          - regression
      cleanup:
        description: >-
          Run the teardown (delete the records this run creates)? Overrides
          test_data/<env>.json's settings.cleanup.enabled for this run only
          — leave as "true" for normal use.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      # GitHub Actions has no true multi-select input type (only string,
      # boolean, choice, environment) — one checkbox per recipient is the
      # closest real equivalent, letting you pick any combination including
      # all three. Only used when environment is prod (see
      # test_data/prod.json -> settings.email_report for the base
      # enabled/recipients list this overrides for this run only).
      notify_rajasekhar:
        description: "Email report to rajasekhar.palleti@cropin.com"
        required: true
        default: true
        type: boolean
      notify_ganesh:
        description: "Email report to ganesh.shanbhag@cropin.com"
        required: true
        default: true
        type: boolean
      notify_sfplusqa:
        description: "Email report to sfplusqa@cropin.com"
        required: true
        default: true
        type: boolean

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve run parameters
        id: params
        run: |
          # Schedule-triggered runs have no `inputs` context at all (that's
          # only populated for workflow_dispatch), so this step is the one
          # place that decides what every later step actually uses —
          # everything downstream reads steps.params.outputs.*, never
          # `inputs.*` directly.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "markers=sanity" >> "$GITHUB_OUTPUT"
            echo "cleanup=true" >> "$GITHUB_OUTPUT"
            echo "notify_rajasekhar=true" >> "$GITHUB_OUTPUT"
            echo "notify_ganesh=true" >> "$GITHUB_OUTPUT"
            echo "notify_sfplusqa=true" >> "$GITHUB_OUTPUT"
          else
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "markers=${{ inputs.markers }}" >> "$GITHUB_OUTPUT"
            echo "cleanup=${{ inputs.cleanup }}" >> "$GITHUB_OUTPUT"
            echo "notify_rajasekhar=${{ inputs.notify_rajasekhar }}" >> "$GITHUB_OUTPUT"
            echo "notify_ganesh=${{ inputs.notify_ganesh }}" >> "$GITHUB_OUTPUT"
            echo "notify_sfplusqa=${{ inputs.notify_sfplusqa }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run API tests
        env:
          ENV_TARGET: ${{ steps.params.outputs.environment }}
          MARKER_EXPR: ${{ steps.params.outputs.markers }}
          # Overrides test_data/<env>.json's settings.cleanup.enabled for
          # this run only — see tests/conftest.py's cleanup_created_records.
          CLEANUP_OVERRIDE: ${{ steps.params.outputs.cleanup }}
          # Per-environment credentials — configure these in
          # Settings -> Secrets and variables -> Actions. Only the block
          # matching ENV_TARGET actually gets used (see src/config/settings.py).
          CROPIN_QA_USERNAME: ${{ secrets.CROPIN_QA_USERNAME }}
          CROPIN_QA_PASSWORD: ${{ secrets.CROPIN_QA_PASSWORD }}
          CROPIN_QA_TENANT_ID: ${{ secrets.CROPIN_QA_TENANT_ID }}
          CROPIN_UAT_USERNAME: ${{ secrets.CROPIN_UAT_USERNAME }}
          CROPIN_UAT_PASSWORD: ${{ secrets.CROPIN_UAT_PASSWORD }}
          CROPIN_UAT_TENANT_ID: ${{ secrets.CROPIN_UAT_TENANT_ID }}
          CROPIN_PROD_USERNAME: ${{ secrets.CROPIN_PROD_USERNAME }}
          CROPIN_PROD_PASSWORD: ${{ secrets.CROPIN_PROD_PASSWORD }}
          CROPIN_PROD_TENANT_ID: ${{ secrets.CROPIN_PROD_TENANT_ID }}
          # SMTP — only used when ENV_TARGET is prod (see
          # test_data/prod.json -> settings.email_report for the on/off
          # switch and recipients).
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          NOTIFY_RAJASEKHAR: ${{ steps.params.outputs.notify_rajasekhar }}
          NOTIFY_GANESH: ${{ steps.params.outputs.notify_ganesh }}
          NOTIFY_SFPLUSQA: ${{ steps.params.outputs.notify_sfplusqa }}
        run: |
          # Builds this run's recipient list from the three checkboxes above
          # — read by tests/conftest.py's pytest_unconfigure, which prefers
          # this over test_data/prod.json's settings.email_report.recipients
          # when set. Empty (all three unchecked) means "send to nobody",
          # not "fall back to test data" — an explicit choice for this run.
          RECIPIENTS=""
          [ "$NOTIFY_RAJASEKHAR" = "true" ] && RECIPIENTS="rajasekhar.palleti@cropin.com"
          [ "$NOTIFY_GANESH" = "true" ] && RECIPIENTS="${RECIPIENTS:+$RECIPIENTS,}ganesh.shanbhag@cropin.com"
          [ "$NOTIFY_SFPLUSQA" = "true" ] && RECIPIENTS="${RECIPIENTS:+$RECIPIENTS,}sfplusqa@cropin.com"
          export EMAIL_RECIPIENTS_OVERRIDE="$RECIPIENTS"

          if [ "$MARKER_EXPR" = "all" ]; then
            pytest --env="$ENV_TARGET"
          else
            pytest --env="$ENV_TARGET" -m "$MARKER_EXPR"
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ steps.params.outputs.environment }}
          path: reports/report_${{ steps.params.outputs.environment }}.html
          if-no-files-found: warn
