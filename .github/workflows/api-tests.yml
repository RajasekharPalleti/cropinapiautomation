name: API Test Suite

# Triggered only via workflow_dispatch — manual, via the Actions tab
# "Run workflow" button, `gh workflow run api-tests.yml`, or an external
# cron pinger hitting the REST API dispatch endpoint on a schedule (see
# README.md section 8.4 — GitHub's own `schedule:` trigger was tried first
# but is best-effort and silently dropped runs, so the daily 10:35 AM IST
# Mon-Sat trigger now lives outside GitHub entirely).
#
# Every run creates real records (farmer, asset, plan type, crop variety,
# plan, project, ...) in whichever environment is targeted. Unspecified
# inputs fall back to their defaults below (prod / regression / cleanup on /
# all three recipients), which is what the external cron pinger relies on.
# The "markers" default is a standing choice, not a permanent one — change
# it below whenever the daily run should target a different suite.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - qa
          - uat
          - prod
      markers:
        description: "Which tests to run"
        required: true
        default: "regression"
        type: choice
        options:
          - sanity
          - smoke
          - regression
      cleanup:
        description: "Run the teardown (delete the records this run creates)?"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      # GitHub Actions has no true multi-select input type (only string,
      # boolean, choice, environment) — one checkbox per recipient is the
      # closest real equivalent, letting you pick any combination including
      # all three. Only used when environment is prod (see
      # test_data/prod.json -> settings.email_report for the base
      # enabled/recipients list this overrides for this run only).
      notify_rajasekhar:
        description: "Email report to rajasekhar.palleti@cropin.com"
        required: true
        default: true
        type: boolean
      notify_ganesh:
        description: "Email report to ganesh.shanbhag@cropin.com"
        required: true
        default: true
        type: boolean
      notify_sfplusqa:
        description: "Email report to sfplusqa@cropin.com"
        required: true
        default: true
        type: boolean

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        env:
          ENV_TARGET: ${{ inputs.environment }}
          MARKER_EXPR: ${{ inputs.markers }}
          # Overrides test_data/<env>.json's settings.cleanup.enabled for
          # this run only — see tests/conftest.py's cleanup_created_records.
          CLEANUP_OVERRIDE: ${{ inputs.cleanup }}
          # Per-environment credentials — configure these in
          # Settings -> Secrets and variables -> Actions. Only the block
          # matching ENV_TARGET actually gets used (see src/config/settings.py).
          CROPIN_QA_USERNAME: ${{ secrets.CROPIN_QA_USERNAME }}
          CROPIN_QA_PASSWORD: ${{ secrets.CROPIN_QA_PASSWORD }}
          CROPIN_QA_TENANT_ID: ${{ secrets.CROPIN_QA_TENANT_ID }}
          CROPIN_UAT_USERNAME: ${{ secrets.CROPIN_UAT_USERNAME }}
          CROPIN_UAT_PASSWORD: ${{ secrets.CROPIN_UAT_PASSWORD }}
          CROPIN_UAT_TENANT_ID: ${{ secrets.CROPIN_UAT_TENANT_ID }}
          CROPIN_PROD_USERNAME: ${{ secrets.CROPIN_PROD_USERNAME }}
          CROPIN_PROD_PASSWORD: ${{ secrets.CROPIN_PROD_PASSWORD }}
          CROPIN_PROD_TENANT_ID: ${{ secrets.CROPIN_PROD_TENANT_ID }}
          # SMTP — only used when ENV_TARGET is prod (see
          # test_data/prod.json -> settings.email_report for the on/off
          # switch and recipients).
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          NOTIFY_RAJASEKHAR: ${{ inputs.notify_rajasekhar }}
          NOTIFY_GANESH: ${{ inputs.notify_ganesh }}
          NOTIFY_SFPLUSQA: ${{ inputs.notify_sfplusqa }}
        run: |
          # Builds this run's recipient list from the three checkboxes above
          # — read by tests/conftest.py's pytest_unconfigure, which prefers
          # this over test_data/prod.json's settings.email_report.recipients
          # when set. Empty (all three unchecked) means "send to nobody",
          # not "fall back to test data" — an explicit choice for this run.
          RECIPIENTS=""
          [ "$NOTIFY_RAJASEKHAR" = "true" ] && RECIPIENTS="rajasekhar.palleti@cropin.com"
          [ "$NOTIFY_GANESH" = "true" ] && RECIPIENTS="${RECIPIENTS:+$RECIPIENTS,}ganesh.shanbhag@cropin.com"
          [ "$NOTIFY_SFPLUSQA" = "true" ] && RECIPIENTS="${RECIPIENTS:+$RECIPIENTS,}sfplusqa@cropin.com"
          export EMAIL_RECIPIENTS_OVERRIDE="$RECIPIENTS"

          # Every test already carries @pytest.mark.regression alongside its
          # own sanity/smoke marker (see pyproject.toml's marker registry),
          # so "-m regression" already selects the full suite — no separate
          # no-filter "all" case needed.
          pytest --env="$ENV_TARGET" -m "$MARKER_EXPR"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ inputs.environment }}
          path: reports/report_${{ inputs.environment }}.html
          if-no-files-found: warn
