[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --html=reports/report.html --self-contained-html"
testpaths = ["tests"]
# pytest-html defaults to sorting the report by Result (grouping
# Failed/Passed/Skipped together), which scrambles the deliberate
# business-flow order tests/conftest.py's pytest_collection_modifyitems
# puts tests in. "original" renders them in the exact order they ran.
initial_sort = "original"
markers = [
    "sanity: quick per-API happy-path check, narrower than smoke",
    "smoke: critical path checks, run on every commit",
    "regression: full regression suite",
    "auth: authentication and authorization tests",
    "negative: negative/edge-case scenarios",
    "farmer: farmer module tests",
    "asset: asset module tests",
    "plantype: plan type module tests",
    "crop_variety: crop variety module tests",
    "project: project module tests",
    "plan: plan module tests",
    "task: task module tests",
    "task_fill: task fill scenarios (POST /services/farm/api/tasks) — all of tests/task/test_task_fill_*.py",
    "form: form module tests (form creation, update and fill, tests/form/)",
    "boundary: boundary-value scenarios",
    "integrity: data-integrity scenarios (what was sent is what got stored)",
    "security: authentication/authorization/injection scenarios",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
